<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b12"><title>FenstyGPT</title>
<style>
:root{--bg:#090b12;--panel:#121725;--panel2:#192133;--text:#f4f6fb;--muted:#9aa6bd;--accent:#8b5cf6;--line:#283248}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#18203a 0,#090b12 48%);color:var(--text);font:15px system-ui,sans-serif;min-height:100vh}
header{position:sticky;top:0;background:#090b12ef;border-bottom:1px solid var(--line);padding:13px 16px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;gap:10px;align-items:center;font-weight:800;font-size:19px}.logo{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#8b5cf6,#22d3ee);display:grid;place-items:center;font-weight:900}
button,textarea,input{font:inherit}button{border:0;cursor:pointer;color:var(--text);background:var(--panel2);border-radius:12px;padding:10px 13px}button.primary{background:var(--accent);font-weight:700}button:disabled{opacity:.5}
main{max-width:820px;margin:auto;padding:18px 14px 130px}.welcome{text-align:center;padding:35px 10px 20px}.welcome h1{font-size:30px;margin:8px 0}.welcome p{color:var(--muted)}
#messages{display:flex;flex-direction:column;gap:12px}.msg{max-width:88%;padding:12px 14px;border-radius:17px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}.user{align-self:flex-end;background:#49318b}.bot{align-self:flex-start;background:var(--panel);border:1px solid var(--line)}.meta{font-size:11px;color:var(--muted);margin-bottom:4px}
.composer{position:fixed;bottom:0;left:0;right:0;background:#090b12f2;border-top:1px solid var(--line);padding:12px max(12px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom))}
.compose-inner{max-width:820px;margin:auto;display:flex;gap:8px;align-items:end;background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:8px}
#prompt{flex:1;resize:none;max-height:130px;min-height:42px;background:transparent;color:var(--text);border:0;outline:0;padding:10px}
.settings{display:none;position:fixed;inset:0;z-index:5;background:#0009;overflow:auto;padding:18px}.settings.open{display:block}.sheet{max-width:540px;margin:20px auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px}.field{margin:13px 0}.field label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}.field input:not([type=checkbox]):not([type=range]),.field textarea{width:100%;background:#0b1020;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px}.field input[type=range]{width:100%}.row{display:flex;gap:9px;justify-content:flex-end;margin-top:18px}.hint,.status{color:var(--muted);font-size:12px;line-height:1.5}.status{text-align:center;margin:8px auto 0;max-width:820px}.progress{height:5px;background:#202a3d;border-radius:9px;overflow:hidden;max-width:820px;margin:7px auto 0}.progress>div{height:100%;width:0;background:var(--accent);transition:width .2s}
@media(min-width:650px){main{padding-top:28px}.welcome{padding-top:55px}.msg{max-width:78%}}
</style></head>
<body>
<header><div class="brand"><div class="logo">F</div><span id="brandName">FenstyGPT</span></div><button id="settingsBtn">⚙️</button></header>
<main><section class="welcome" id="welcome"><div style="font-size:38px">✨</div><h1>Hey! Ich bin <span id="welcomeName">FenstyGPT</span>.</h1><p>Was geht? Schreib mir einfach.</p></section><div id="messages"></div></main>
<div class="composer"><div class="compose-inner"><textarea id="prompt" rows="1" placeholder="Schreib eine Nachricht …"></textarea><button class="primary" id="sendBtn">Senden ➤</button></div><div class="status" id="status">Noch nicht geladen – sende eine Nachricht zum Starten.</div><div class="progress"><div id="progressBar"></div></div></div>
<div class="settings" id="settings"><div class="sheet"><h2>⚙️ FenstyGPT einstellen</h2>
<div class="field"><label for="name">Name deiner KI</label><input id="name" maxlength="30"></div>
<div class="field"><label for="personality">Charakter / Persönlichkeit</label><textarea id="personality" rows="3"></textarea></div>
<div class="field"><label for="humor">Humor: <b id="humorValue">50%</b></label><input id="humor" type="range" min="0" max="100" value="50"></div>
<div class="field"><label><input id="friend" type="checkbox" style="width:auto"> Freund-Modus aktivieren</label></div>
<div class="field"><label for="rules">Weitere Regeln</label><textarea id="rules" rows="2"></textarea></div>
<p class="hint">Einstellungen bleiben in diesem Browser gespeichert. Die KI läuft lokal auf diesem Gerät – ohne Server und ohne API-Schlüssel.</p>
<div class="row"><button id="closeSettings">Schließen</button><button class="primary" id="saveSettings">Speichern</button></div></div></div>
<script type="module">
import { CreateMLCEngine } from "https://esm.run/@mlc-ai/web-llm";
const $=id=>document.getElementById(id);
const MODEL="gemma3-1b-it-q4f16_1-MLC";
const defaults={name:"FenstyGPT",personality:"Frech und selbstbewusst, aber freundlich. Sprich natürlich und wie ein guter Kumpel.",humor:50,friend:true,rules:"Antworte ehrlich, natürlich und nicht unnötig lang."};
let settings={...defaults};try{settings={...defaults,...JSON.parse(localStorage.getItem("fensty-settings")||"{}")}}catch{}
let engine=null,loading=null,history=[];
function apply(){ $("brandName").textContent=settings.name;$("welcomeName").textContent=settings.name;document.title=settings.name;$("name").value=settings.name;$("personality").value=settings.personality;$("humor").value=settings.humor;$("humorValue").textContent=settings.humor+"%";$("friend").checked=!!settings.friend;$("rules").value=settings.rules; }
function status(s){$("status").textContent=s}
$("settingsBtn").onclick=()=> $("settings").classList.add("open");$("closeSettings").onclick=()=> $("settings").classList.remove("open");
$("humor").oninput=()=> $("humorValue").textContent=$("humor").value+"%";
$("saveSettings").onclick=()=>{settings={name:$("name").value.trim()||"FenstyGPT",personality:$("personality").value,humor:+$("humor").value,friend:$("friend").checked,rules:$("rules").value};localStorage.setItem("fensty-settings",JSON.stringify(settings));apply();$("settings").classList.remove("open");status("Einstellungen gespeichert ✓")};
function add(role,txt){$("welcome").style.display="none";let d=document.createElement("div");d.className="msg "+(role==="user"?"user":"bot");if(role!=="user"){let m=document.createElement("div");m.className="meta";m.textContent=settings.name;d.append(m)}let t=document.createElement("div");t.textContent=txt;d.append(t);$("messages").append(d);window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});return t}
async function load(){if(engine)return engine;if(loading)return loading;if(!("gpu" in navigator))throw Error("WebGPU fehlt. Bitte aktuellen Chrome oder Edge auf einem geeigneten Computer verwenden.");loading=(async()=>{status("Lokale KI wird geladen – erster Download ca. 711 MB …");engine=await CreateMLCEngine(MODEL,{initProgressCallback:p=>{let n=Math.round((p.progress||0)*100);$("progressBar").style.width=n+"%";status(p.text||("KI wird geladen: "+n+"%"))}});$("progressBar").style.width="100%";status("FenstyGPT ist bereit ✓");return engine})();try{return await loading}catch(e){engine=null;loading=null;throw e}}
function system(){return `Du heißt ${settings.name}. Persönlichkeit: ${settings.personality}. Humor-Level: ${settings.humor}/100. Freund-Modus: ${settings.friend?"aktiv":"aus"}. Weitere Regeln: ${settings.rules}. Antworte auf Deutsch, wenn der Nutzer Deutsch schreibt. Sei ehrlich, hilfreich und altersgerecht.`}
async function send(){let text=$("prompt").value.trim();if(!text||$("sendBtn").disabled)return;$("prompt").value="";add("user",text);history.push({role:"user",content:text});$("sendBtn").disabled=true;let node=add("assistant","Ich starte die lokale KI …");try{let ai=await load();node.textContent="Denke nach …";let r=await ai.chat.completions.create({messages:[{role:"system",content:system()},...history.slice(-12)],temperature:0.8,max_tokens:350});let answer=r.choices?.[0]?.message?.content?.trim()||"Keine Antwort erhalten.";node.textContent=answer;history.push({role:"assistant",content:answer});status("Bereit – Antworten entstehen lokal auf diesem Gerät.")}catch(e){node.textContent="Das hat leider nicht geklappt: "+e.message+"\n\nPrüfe WebGPU, Internet und freien Speicher.";status("Lokale KI konnte nicht gestartet werden.")}finally{$("sendBtn").disabled=false;$("prompt").focus()}}
$("sendBtn").onclick=send;$("prompt").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});$("prompt").addEventListener("input",()=>{$("prompt").style.height="42px";$("prompt").style.height=Math.min($("prompt").scrollHeight,130)+"px"});apply();
</script></body></html>
