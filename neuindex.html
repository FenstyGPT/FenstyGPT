
<script>
const API_URL = "https://fenstygpt.hauberhannes.workers.dev/chat";

const $ = id => document.getElementById(id);

const defaults = {
  name: "FenstyGPT",
  personality: "Frech und selbstbewusst, aber freundlich. Sprich natürlich wie ein guter Kumpel.",
  humor: 50,
  friend: true,
  rules: "Antworte ehrlich, natürlich und nicht unnötig lang."
};

let settings = { ...defaults };

try {
  settings = {
    ...defaults,
    ...JSON.parse(localStorage.getItem("fensty-settings") || "{}")
  };
} catch {}

let history = [];

function apply() {
  $("brandName").textContent = settings.name;
  $("welcomeName").textContent = settings.name;
  document.title = settings.name;
  $("name").value = settings.name;
  $("personality").value = settings.personality;
  $("humor").value = settings.humor;
  $("humorValue").textContent = settings.humor + "%";
  $("friend").checked = !!settings.friend;
  $("rules").value = settings.rules;
}

function status(value) {
  $("status").textContent = value;
}

$("settingsBtn").onclick = () =>
  $("settings").classList.add("open");

$("closeSettings").onclick = () =>
  $("settings").classList.remove("open");

$("humor").oninput = () =>
  $("humorValue").textContent = $("humor").value + "%";

$("saveSettings").onclick = () => {
  settings = {
    name: $("name").value.trim() || "FenstyGPT",
    personality: $("personality").value,
    humor: +$("humor").value,
    friend: $("friend").checked,
    rules: $("rules").value
  };

  localStorage.setItem("fensty-settings", JSON.stringify(settings));
  apply();
  $("settings").classList.remove("open");
  status("Einstellungen gespeichert ✓");
};

function add(role, txt) {
  $("welcome").style.display = "none";

  const d = document.createElement("div");
  d.className = "msg " + (role === "user" ? "user" : "bot");

  if (role !== "user") {
    const m = document.createElement("div");
    m.className = "meta";
    m.textContent = settings.name;
    d.append(m);
  }

  const t = document.createElement("div");
  t.textContent = txt;
  d.append(t);

  $("messages").append(d);
  window.scrollTo({
    top: document.body.scrollHeight,
    behavior: "smooth"
  });

  return t;
}

async function send() {
  const text = $("prompt").value.trim();

  if (!text || $("sendBtn").disabled) return;

  $("prompt").value = "";
  add("user", text);

  const previousHistory = [...history];

  history.push({
    role: "user",
    parts: [{ text }]
  });

  $("sendBtn").disabled = true;
  const node = add("assistant", "FenstyGPT denkt nach ...");

  status("Verbinde mit NVIDIA Nemotron ...");

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        settings,
        history
      })
    });

    const result = await response.json();

    if (!response.ok) {
      throw new Error(result.error || "Serverfehler " + response.status);
    }

    if (!result.reply) {
      throw new Error("Keine Antwort erhalten.");
    }

    node.textContent = result.reply;

    history.push({
      role: "model",
      parts: [{ text: result.reply }]
    });

    status("FenstyGPT ist bereit ✓");

  } catch (error) {
    node.textContent = "Ups, das hat nicht geklappt: " + error.message;
    history = previousHistory;
    status("Verbindungsfehler – bitte erneut versuchen.");
  } finally {
    $("sendBtn").disabled = false;
    $("prompt").focus();
  }
}

$("sendBtn").onclick = send;

$("prompt").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

$("prompt").addEventListener("input", () => {
  $("prompt").style.height = "42px";
  $("prompt").style.height =
    Math.min($("prompt").scrollHeight, 130) + "px";
});

apply();
</script>
