<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b12">
<title>FenstyGPT</title>
<style>
:root{--bg:#090b12;--panel:#121725;--panel2:#192133;--text:#f4f6fb;--muted:#9aa6bd;--accent:#8b5cf6;--line:#283248}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#18203a 0,#090b12 48%);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
header{position:sticky;top:0;z-index:2;background:#090b12eF;border-bottom:1px solid var(--line);padding:13px 16px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;gap:10px;align-items:center;font-weight:800;font-size:19px}.logo{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#8b5cf6,#22d3ee);display:grid;place-items:center;color:white;font-weight:900}
button,input,textarea{font:inherit}button{border:0;cursor:pointer;color:var(--text);background:var(--panel2);border-radius:12px;padding:10px 13px}button.primary{background:var(--accent);font-weight:700}button:disabled{opacity:.5;cursor:wait}
main{max-width:820px;margin:auto;padding:18px 14px 120px}.welcome{text-align:center;padding:35px 10px 20px}.welcome h1{font-size:30px;margin:8px 0}.welcome p{color:var(--muted);margin:0}
#messages{display:flex;flex-direction:column;gap:12px}.msg{max-width:88%;padding:12px 14px;border-radius:17px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}.user{align-self:flex-end;background:#49318b;border-bottom-right-radius:5px}.bot{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:5px}.meta{font-size:11px;color:var(--muted);margin-bottom:4px}
.composer{position:fixed;bottom:0;left:0;right:0;background:#090b12f2;border-top:1px solid var(--line);padding:12px max(12px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));}
.compose-inner{max-width:820px;margin:auto;display:flex;gap:8px;align-items:end;background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:8px}
textarea{flex:1;resize:none;max-height:130px;min-height:42px;background:transparent;color:var(--text);border:0;outline:0;padding:10px}
.settings{display:none;position:fixed;inset:0;z-index:5;background:#0009;overflow:auto;padding:18px}.settings.open{display:block}.sheet{max-width:540px;margin:20px auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px}.sheet h2{margin:0 0 15px}.field{margin:13px 0}.field label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}.field input,.field textarea{width:100%;background:#0b1020;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px;min-height:unset}.field input[type=range]{padding:0}.row{display:flex;gap:9px;justify-content:flex-end;margin-top:18px}.hint{color:var(--muted);font-size:12px;line-height:1.5}.status{font-size:12px;color:var(--muted);text-align:center;margin-top:8px}
@media(min-width:650px){main{padding-top:28px}.welcome{padding-top:55px}.msg{max-width:78%}}
</style>
</head>
<body>
<header><div class="brand"><div class="logo">F</div><span id="brandName">FenstyGPT</span></div><button id="settingsBtn" aria-label="Einstellungen">⚙️</button></header>
<main>
<section class="welcome" id="welcome"><div style="font-size:38px">✨</div><h1>Hey! Ich bin <span id="welcomeName">FenstyGPT</span>.</h1><p>Was geht? Schreib mir einfach.</p></section>
<div id="messages"></div>
</main>
<div class="composer"><div class="compose-inner"><textarea id="prompt" rows="1" placeholder="Schreib eine Nachricht …"></textarea><button class="primary" id="sendBtn">Senden ➤</button></div><div class="status" id="status">Bereit</div></div>
<div class="settings" id="settings">
 <div class="sheet">
  <h2>⚙️ FenstyGPT einstellen</h2>
  <div class="field"><label for="name">Name deiner KI</label><input id="name" maxlength="30"></div>
  <div class="field"><label for="personality">Charakter / Persönlichkeit</label><textarea id="personality" rows="3"></textarea></div>
  <div class="field"><label for="humor">Humor: <b id="humorValue">50%</b></label><input id="humor" type="range" min="0" max="100" value="50"></div>
  <div class="field"><label><input id="friend" type="checkbox" style="width:auto"> Freund-Modus aktivieren</label></div>
  <div class="field"><label for="rules">Weitere Regeln</label><textarea id="rules" rows="2"></textarea></div>
  <div class="field"><label for="worker">KI-Server-Adresse (wird einmal eingerichtet)</label><input id="worker" placeholder="https://dein-worker.dein-name.workers.dev"></div>
  <p class="hint">Der geheime KI-Schlüssel gehört nur in die Server-Einstellungen, niemals hier hinein. Die Einstellungen dieser Seite werden auf diesem Gerät gespeichert.</p>
  <div class="row"><button id="closeSettings">Abbrechen</button><button class="primary" id="saveSettings">Speichern</button></div>
 </div>
</div>
<script>
const $=id=>document.getElementById(id);
const defaults={name:"FenstyGPT",personality:"Frech und selbstbewusst, aber freundlich. Sprich natürlich und wie ein guter Kumpel.",humor:50,friend:true,rules:"Antworte ehrlich, natürlich und nicht unnötig lang.",worker:""};
let settings={...defaults,...JSON.parse(localStorage.getItem("fensty-settings")||"{}")};
let history=[];
function applySettings(){ $("brandName").textContent=settings.name;$("welcomeName").textContent=settings.name;document.title=settings.name;$("name").value=settings.name;$("personality").value=settings.personality;$("humor").value=settings.humor;$("humorValue").textContent=settings.humor+"%";$("friend").checked=!!settings.friend;$("rules").value=settings.rules;$("worker").value=settings.worker||""; }
function openSettings(){$("settings").classList.add("open")}
function closeSettings(){$("settings").classList.remove("open")}
$("settingsBtn").onclick=openSettings;$("closeSettings").onclick=closeSettings;
$("humor").oninput=()=> $("humorValue").textContent=$("humor").value+"%";
$("saveSettings").onclick=()=>{settings={name:$("name").value.trim()||"FenstyGPT",personality:$("personality").value,humor:+$("humor").value,friend:$("friend").checked,rules:$("rules").value,worker:$("worker").value.trim().replace(/\/+$/,"")};localStorage.setItem("fensty-settings",JSON.stringify(settings));applySettings();closeSettings();setStatus("Einstellungen gespeichert ✓")};
function setStatus(s){$("status").textContent=s}
function addMessage(role,text){$("welcome").style.display="none";const d=document.createElement("div");d.className="msg "+(role==="user"?"user":"bot");if(role!=="user"){const m=document.createElement("div");m.className="meta";m.textContent=settings.name;d.appendChild(m)}const t=document.createElement("div");t.textContent=text;d.appendChild(t);$("messages").appendChild(d);window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});return d}
async function send(){const text=$("prompt").value.trim();if(!text||$("sendBtn").disabled)return;if(!settings.worker){openSettings();setStatus("Bitte zuerst die Server-Adresse eintragen.");return}
$("prompt").value="";$("prompt").style.height="42px";addMessage("user",text);history.push({role:"user",parts:[{text}]});$("sendBtn").disabled=true;setStatus(settings.name+" denkt …");
const thinking=addMessage("model","Einen Moment …");
try{
 const res=await fetch(settings.worker+"/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({history:history.slice(-20),settings:{name:settings.name,personality:settings.personality,humor:settings.humor,friend:settings.friend,rules:settings.rules}})});
 const data=await res.json();if(!res.ok)throw new Error(data.error||"Serverfehler ("+res.status+")");
 const answer=data.reply||"Ich habe gerade keine Antwort bekommen.";thinking.lastChild.textContent=answer;history.push({role:"model",parts:[{text:answer}]});setStatus("Bereit");
}catch(e){thinking.lastChild.textContent="Ups, das hat nicht geklappt: "+e.message+"\nPrüfe deine Server-Adresse und ob der KI-Server eingerichtet ist.";setStatus("Verbindung fehlgeschlagen")}
finally{$("sendBtn").disabled=false;$("prompt").focus()}
}
$("sendBtn").onclick=send;$("prompt").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});
$("prompt").addEventListener("input",()=>{$("prompt").style.height="42px";$("prompt").style.height=Math.min($("prompt").scrollHeight,130)+"px"});
applySettings();
</script>
</body></html>
