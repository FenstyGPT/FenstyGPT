<script>
const API_URL = "https://fenstygpt.hauberhannes.workers.dev/chat";

const $ = id => document.getElementById(id);

const defaults = {
  name: "FenstyGPT",
  personality: "Frech und selbstbewusst, aber freundlich. Sprich natürlich wie ein guter Kumpel.",
  humor: 50,
  friend: true,
  rules: "Antworte ehrlich, natürlich und nicht unnötig lang."
};

let settings = { ...defaults };

try {
  settings = {
    ...defaults,
    ...JSON.parse(localStorage.getItem("fensty-settings") || "{}")
  };
} catch {}

let history = [];

function apply() {
  $("brandName").textContent = settings.name;
  $("welcomeName").textContent = settings.name;
  document.title = settings.name;
  $("name").value = settings.name;
  $("personality").value = settings.personality;
  $("humor").value = settings.humor;
  $("humorValue").textContent = settings.humor + "%";
  $("friend").checked = !!settings.friend;
  $("rules").value = settings.rules;
}

function status(value) {
  $("status").textContent = value;
}

$("settingsBtn").onclick = () =>
  $("settings").classList.add("open");

$("closeSettings").onclick = () =>
  $("settings").classList.remove("open");
